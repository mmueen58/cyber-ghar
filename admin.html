<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Cyber Ghar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
        }

        header {
            background-color: #00251a;
            color: white;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h1 {
            color: #004d40;
            margin-bottom: 1.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid #004d40;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .stat-card .number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #004d40;
        }

        .orders-section {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #004d40;
            color: white;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-pending {
            background-color: #ffecb3;
            color: #ff8f00;
        }

        .status-completed {
            background-color: #c8e6c9;
            color: #2e7d32;
        }

        .action-btn {
            padding: 6px 12px;
            background-color: #00796b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background-color: #004d40;
        }
    </style>
</head>
<body>

    <header>
        <h2>🛡️ Cyber Ghar Admin Portal</h2>
        <span>Logged in as Admin</span>
    </header>

    <div class="container">
        <h1>Dashboard Overview</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Orders</h3>
                <div class="number" id="total-orders">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending Tasks</h3>
                <div class="number" id="pending-orders">0</div>
            </div>
            <div class="stat-card">
                <h3>Completed Tasks</h3>
                <div class="number" id="completed-orders">0</div>
            </div>
        </div>

        <div class="orders-section">
            <h2>Recent Customer Orders</h2>
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer Name</th>
                        <th>Phone</th>
                        <th>Service</th>
                        <th>Notes</th>
                        <th>Files</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <!-- Dynamic orders load here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchOrders() {
            try {
                const response = await fetch('/api/get-orders');
                const orders = await response.json();

                let total = orders.length;
                let pending = orders.filter(o => o.status === 'Pending').length;
                let completed = orders.filter(o => o.status === 'Completed').length;

                document.getElementById('total-orders').innerText = total;
                document.getElementById('pending-orders').innerText = pending;
                document.getElementById('completed-orders').innerText = completed;

                const tableBody = document.getElementById('orders-table-body');
                tableBody.innerHTML = '';

                orders.forEach(order => {
                    const isCompleted = order.status === 'Completed';
                    const badgeClass = isCompleted ? 'status-badge status-completed' : 'status-badge status-pending';
                    
                    let fileActionHtml = 'No File';
                    if (order.filename) {
                        fileActionHtml = `<a href="/download/${order.filename}" target="_blank" style="padding: 5px 10px; background: #0288d1; color: white; text-decoration: none; border-radius: 4px; font-size: 0.85rem;">Download</a>`;
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${order.id}</td>
                        <td>${order.fullname}</td>
                        <td>${order.phone}</td>
                        <td>${order.service}</td>
                        <td>${order.notes}</td>
                        <td>${fileActionHtml}</td>
                        <td><span class="${badgeClass}">${order.status}</span></td>
                        <td>
                            <button class="action-btn" style="${isCompleted ? 'background-color: #2e7d32;' : ''}" 
                                onclick="completeOrder(this, '${order.id}')" ${isCompleted ? 'disabled' : ''}>
                                ${isCompleted ? 'Done' : 'Mark Complete'}
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (err) {
                console.error('Failed to load orders', err);
            }
        }

        function completeOrder(btn, orderId) {
            const row = btn.closest('tr');
            const badge = row.querySelector('.status-badge');
            badge.className = 'status-badge status-completed';
            badge.innerText = 'Completed';
            btn.innerText = 'Done';
            btn.style.backgroundColor = '#2e7d32';
            btn.disabled = true;

            let pendingCount = parseInt(document.getElementById('pending-orders').innerText) - 1;
            let completedCount = parseInt(document.getElementById('completed-orders').innerText) + 1;
            document.getElementById('pending-orders').innerText = Math.max(0, pendingCount);
            document.getElementById('completed-orders').innerText = completedCount;
        }

        fetchOrders();
    </script>

</body>
</html>
